[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstats"
version = "0.1.0"
description = "Stream log file analyzer for CSV and JSONL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    
]

[project.scripts]
streamstats = "streamstats.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"